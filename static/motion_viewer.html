<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiyori Motion Viewer</title>
    <script>
      window.LIVE2D_UNAVAILABLE = false;
    </script>
    <script
      src="/static/live2d/core/live2dcubismcore.js"
      onerror="
        window.LIVE2D_UNAVAILABLE = true;
        console.warn('live2dcubismcore not found');
      "
    ></script>
    <script
      src="/static/live2d/core/pixi.min.js"
      onerror="window.LIVE2D_UNAVAILABLE = true"
    ></script>
    <script
      src="/static/live2d/core/pixi-live2d-cubism4.min.js"
      onerror="window.LIVE2D_UNAVAILABLE = true"
    ></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=JetBrains+Mono:wght@400;600&display=swap");

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a0d14;
        --panel: #111520;
        --border: rgba(100, 140, 200, 0.15);
        --accent: #4f8ef7;
        --accent2: #a78bfa;
        --text: #c8d8f0;
        --muted: #5a6a88;
        --active: #1a2540;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Sans Thai", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* grid noise overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(rgba(79, 142, 247, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 142, 247, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      header {
        position: relative;
        z-index: 10;
        padding: 18px 28px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
        background: rgba(10, 13, 20, 0.8);
        backdrop-filter: blur(12px);
      }

      header .logo {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: rgba(79, 142, 247, 0.1);
        border: 1px solid rgba(79, 142, 247, 0.25);
        padding: 4px 10px;
        border-radius: 4px;
      }

      header h1 {
        font-size: 1rem;
        font-weight: 400;
        color: var(--text);
        letter-spacing: 0.05em;
      }

      header .status {
        margin-left: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: var(--muted);
      }
      header .status span {
        color: #4ade80;
        animation: blink 2s step-end infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .workspace {
        position: relative;
        z-index: 1;
        display: flex;
        flex: 1;
        overflow: hidden;
        height: calc(100vh - 57px);
      }

      /* ── LIVE2D CANVAS ── */
      #canvas-wrap {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #canvas-wrap::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 120px;
        background: linear-gradient(transparent, var(--bg));
        pointer-events: none;
        z-index: 2;
      }

      #live2d-canvas {
        position: absolute;
        inset: 0;
      }

      /* current motion overlay */
      #now-playing {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        color: var(--accent);
        background: rgba(10, 13, 20, 0.85);
        border: 1px solid rgba(79, 142, 247, 0.3);
        padding: 6px 16px;
        border-radius: 999px;
        letter-spacing: 0.1em;
        backdrop-filter: blur(8px);
        transition: opacity 0.3s;
        white-space: nowrap;
      }

      /* ── SIDE PANEL ── */
      #panel {
        width: 300px;
        border-left: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .panel-header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--border);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.65rem;
        color: var(--muted);
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .motion-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .motion-list::-webkit-scrollbar {
        width: 4px;
      }
      .motion-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .motion-list::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      .motion-btn {
        width: 100%;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        cursor: pointer;
        text-align: left;
        transition: all 0.18s ease;
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
        font-family: "Noto Sans Thai", sans-serif;
      }

      .motion-btn:hover {
        background: rgba(79, 142, 247, 0.08);
        border-color: rgba(79, 142, 247, 0.35);
        transform: translateX(-2px);
      }

      .motion-btn.active {
        background: var(--active);
        border-color: var(--accent);
        box-shadow:
          0 0 0 1px rgba(79, 142, 247, 0.2),
          inset 0 0 20px rgba(79, 142, 247, 0.05);
      }

      .motion-btn.active .btn-num {
        background: var(--accent);
        color: #fff;
      }

      .btn-num {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--muted);
        transition: all 0.18s;
      }

      .btn-info {
        flex: 1;
        min-width: 0;
      }

      .btn-name {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 2px;
      }

      .btn-meta {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.62rem;
        color: var(--muted);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn-meta .tag {
        background: rgba(167, 139, 250, 0.1);
        color: var(--accent2);
        padding: 1px 6px;
        border-radius: 3px;
        border: 1px solid rgba(167, 139, 250, 0.2);
      }

      .btn-play {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(79, 142, 247, 0.1);
        border: 1px solid rgba(79, 142, 247, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        transition: all 0.18s;
        font-size: 0.7rem;
      }

      .motion-btn:hover .btn-play,
      .motion-btn.active .btn-play {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      /* copy badge */
      .copy-box {
        padding: 14px 16px;
        border-top: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.2);
      }

      .copy-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.6rem;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .copy-code {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        color: #a5f3c0;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(74, 222, 128, 0.2);
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.18s;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        word-break: break-all;
      }

      .copy-code:hover {
        background: rgba(74, 222, 128, 0.08);
        border-color: rgba(74, 222, 128, 0.4);
      }

      .copy-icon {
        flex-shrink: 0;
        opacity: 0.6;
      }

      .copy-toast {
        font-size: 0.62rem;
        color: #4ade80;
        margin-top: 6px;
        opacity: 0;
        transition: opacity 0.3s;
        font-family: "JetBrains Mono", monospace;
      }
      .copy-toast.show {
        opacity: 1;
      }

      /* loading state */
      #loading-msg {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 10;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* playing pulse */
      @keyframes pulse-border {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(79, 142, 247, 0.4);
        }
        50% {
          box-shadow: 0 0 0 6px rgba(79, 142, 247, 0);
        }
      }
      .motion-btn.active {
        animation: pulse-border 2s ease infinite;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Live2D</div>
      <h1>Motion Viewer — Fern</h1>
      <div class="status">● <span>LIVE</span> &nbsp;pixi-live2d</div>
    </header>

    <div class="workspace">
      <!-- Canvas -->
      <div id="canvas-wrap">
        <div id="live2d-canvas"></div>
        <div id="loading-msg">
          <div class="spinner"></div>
          <span>กำลังโหลดโมเดล...</span>
        </div>
        <div id="now-playing" style="opacity: 0">— ยังไม่ได้เลือก —</div>
      </div>

      <!-- Panel -->
      <div id="panel">
        <div class="panel-header">// motion list</div>
        <div class="motion-list" id="motion-list"></div>
        <div class="copy-box">
          <div class="copy-label">// copy for game.js</div>
          <div class="copy-code" id="copy-code" onclick="copyCode()">
            <span id="copy-text">เลือก motion ก่อน</span>
            <span class="copy-icon">⎘</span>
          </div>
          <div class="copy-toast" id="copy-toast">✓ copied!</div>
        </div>
      </div>
    </div>

    <script>
      // ─── Motion metadata ───────────────────────────────────────────────
      const MOTIONS = [
        {
          id: "fern_neutral",
          dur: "4.0s",
          tags: ["เฉย", "หายใจ"],
          label: "neutral / idle",
        },
        {
          id: "fern_cold",
          dur: "3.0s",
          tags: ["เย็นชา", "โกรธ"],
          label: "cold เย็นชา",
        },
        {
          id: "fern_sad",
          dur: "4.0s",
          tags: ["ก้มหน้า", "เศร้า"],
          label: "sad หดหู่",
        },
        {
          id: "fern_warm",
          dur: "4.0s",
          tags: ["ตายิ้ม", "เปิดใจ"],
          label: "warm อบอุ่น",
        },
        {
          id: "fern_happy",
          dur: "3.0s",
          tags: ["ยิ้ม", "ตาโต"],
          label: "happy ร่าเริง",
        },
        {
          id: "fern_touched",
          dur: "4.0s",
          tags: ["ก้มหน้า", "ซึ้ง"],
          label: "touched ซึ้งใจ",
        },
      ];

      let live2dModel = null;
      let activeBtn = null;
      let currentMotion = null;

      // ─── Build button list ───────────────────────────────────────────
      function buildList() {
        const list = document.getElementById("motion-list");
        MOTIONS.forEach((m, i) => {
          const btn = document.createElement("button");
          btn.className = "motion-btn";
          btn.id = "btn-" + m.id;
          btn.innerHTML = `
      <div class="btn-num">${String(i + 1).padStart(2, "0")}</div>
      <div class="btn-info">
        <div class="btn-name">${m.id}</div>
        <div class="btn-meta">
          <span>${m.dur}</span>
          ${m.tags.map((t) => `<span class="tag">${t}</span>`).join("")}
        </div>
        <div style="font-size:0.68rem;color:#7090b8;margin-top:3px">${m.label}</div>
      </div>
      <div class="btn-play">▶</div>
    `;
          btn.onclick = () => playMotion(m.id, btn);
          list.appendChild(btn);
        });
      }

      // ─── Play motion ─────────────────────────────────────────────────
      function playMotion(motionId, btn) {
        if (!live2dModel) return;

        // update active button
        if (activeBtn) activeBtn.classList.remove("active");
        btn.classList.add("active");
        activeBtn = btn;
        currentMotion = motionId;

        // stop current + play new
        try {
          live2dModel.internalModel.motionManager.stopAllMotions();
          live2dModel.motion(motionId, 0);
        } catch (e) {
          console.warn("motion error:", e);
        }

        // update overlay
        const np = document.getElementById("now-playing");
        np.textContent = "▶ " + motionId;
        np.style.opacity = "1";

        // update copy box
        document.getElementById("copy-text").textContent =
          `motion: "${motionId}"`;
      }

      // ─── Copy to clipboard ────────────────────────────────────────────
      function copyCode() {
        if (!currentMotion) return;
        const text = `motion: "${currentMotion}"`;
        navigator.clipboard.writeText(text).then(() => {
          const toast = document.getElementById("copy-toast");
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 2000);
        });
      }

      // ─── Init Live2D ─────────────────────────────────────────────────
      async function initLive2D() {
        if (!window.PIXI || !window.PIXI.live2d) {
          document.getElementById("loading-msg").innerHTML =
            `<span style="color:#f87171">⚠ ไม่พบ Live2D libs</span>
       <span style="font-size:0.6rem">ต้องรันจาก Flask server</span>`;
          return;
        }

        try {
          const { Live2DModel } = PIXI.live2d;
          const wrap = document.getElementById("live2d-canvas");

          const app = new PIXI.Application({
            width: wrap.clientWidth || 500,
            height: wrap.clientHeight || 700,
            backgroundAlpha: 0,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true,
          });
          wrap.appendChild(app.view);
          app.view.style.cssText =
            "position:absolute;inset:0;width:100%!important;height:100%!important;";

          window.addEventListener("resize", () => {
            app.renderer.resize(wrap.clientWidth, wrap.clientHeight);
            if (live2dModel) reposition(app);
          });

          const model = await Live2DModel.from(
            "/static/live2d/fern/fern.model3.json",
          );
          app.stage.addChild(model);
          live2dModel = model;

          // ปิด idle
          try {
            model.internalModel.motionManager.stopAllMotions();
            model.internalModel.motionManager.reserveIdleMotion = () => false;
          } catch (_) {}

          reposition(app);

          // hide loading
          document.getElementById("loading-msg").style.display = "none";
        } catch (err) {
          document.getElementById("loading-msg").innerHTML =
            `<span style="color:#f87171">⚠ โหลดโมเดลไม่ได้</span>
       <span style="font-size:0.6rem;color:#5a6a88">${err.message}</span>`;
        }
      }

      function reposition(app) {
        if (!live2dModel) return;
        const m = live2dModel;
        const w = app.renderer.width;
        const h = app.renderer.height;
        const scale = Math.min(
          (w / m.internalModel.originalWidth) * 1,
          (h / m.internalModel.originalHeight) * 0.9,
        );
        m.scale.set(scale);
        m.x = 150;
        m.y = h * 0.05;
      }

      // ─── Boot ─────────────────────────────────────────────────────────
      buildList();
      initLive2D();
    </script>
  </body>
</html>
